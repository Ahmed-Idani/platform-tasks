# Example webhook endpoint. callback_url from the cluster: http://inbox.platform:9000/hook
apiVersion: v1
kind: Service
metadata:
  name: inbox
spec:
  selector: { app: inbox }
  ports: [{ name: http, port: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbox
spec:
  replicas: 1
  selector: { matchLabels: { app: inbox } }
  template:
    metadata:
      labels: { app: inbox }
    spec:
      containers:
        - name: inbox
          image: python:3.12-alpine
          command: ["python", "-u", "/app/webhook_receiver.py"]
          ports: [{ name: http, containerPort: 9000 }]
          volumeMounts:
            - { name: code, mountPath: /app }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: code
          configMap: { name: webhook-inbox }
