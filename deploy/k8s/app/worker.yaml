apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # replicas: owned by KEDA (worker-autoscaling.yaml)
  selector: { matchLabels: { app: worker } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: worker }
    spec:
      # > TASK_TIMEOUT_S: on SIGTERM the worker finishes its current task before exiting.
      terminationGracePeriodSeconds: 600
      containers:
        - name: worker
          image: platform-worker
          ports: [{ name: health, containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: platform-config } }]
          env:
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: RABBITMQ_PASSWORD } }
            - name: DATABASE_URL
              value: postgresql://admin:$(POSTGRES_PASSWORD)@postgres:5432/tasks
            - name: RABBITMQ_URL
              value: amqp://admin:$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: platform-secrets, key: S3_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: platform-secrets, key: S3_SECRET_ACCESS_KEY } }
            - { name: N_THREADS, value: "2" }   # must equal the CPU limit
            - { name: TASK_TIMEOUT_S, value: "540" }
          # Up to 2 min to load the model before liveness applies (else: crash loop mid-load).
          startupProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 5
            timeoutSeconds: 5
          # Measured ~1.05 GiB resident + KV cache (grows with the input).
          resources:
            requests: { cpu: "2", memory: 1200Mi }
            limits: { cpu: "2", memory: 3Gi }
