# Bucket configuration (lifecycle rule), once per deploy, like a migration.
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-init
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: storage-init
          image: platform-api
          command: ["/storage-init"]
          envFrom: [{ configMapRef: { name: platform-config } }]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: platform-secrets, key: S3_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: platform-secrets, key: S3_SECRET_ACCESS_KEY } }
