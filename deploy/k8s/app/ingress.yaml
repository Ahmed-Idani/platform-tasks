apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-inbox
spec:
  stripPrefix:
    prefixes: [/inbox]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - { path: /v1, pathType: Prefix, backend: { service: { name: api, port: { number: 8080 } } } }
          - { path: /healthz, pathType: Exact, backend: { service: { name: api, port: { number: 8080 } } } }
          - { path: /rabbitmq, pathType: Prefix, backend: { service: { name: rabbitmq, port: { number: 15672 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
# The inbox page doesn't know its prefix: Traefik strips /inbox before forwarding.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inbox
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: platform-strip-inbox@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - { path: /inbox, pathType: Prefix, backend: { service: { name: inbox, port: { number: 9000 } } } }
