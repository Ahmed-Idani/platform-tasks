apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-management
spec:
  secretTargetRef:
    - { parameter: host, name: platform-secrets, key: KEDA_RABBITMQ_HOST }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 0
  maxReplicaCount: 4          # 2 CPU + 1.2 GiB each: 4 fit on this machine
  pollingInterval: 5
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies: [{ type: Pods, value: 1, periodSeconds: 30 }]
  triggers:
    - type: rabbitmq
      authenticationRef: { name: rabbitmq-management }
      metadata:
        protocol: http            # counts ready + unacked, so busy workers aren't scaled away
        queueName: tasks.llm_inference
        mode: QueueLength
        value: "1"                # prefetch 1: one message per worker
        activationValue: "0"
