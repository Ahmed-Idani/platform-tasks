# Each tool is configured to serve under its prefix, so the path is forwarded unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend: { service: { name: monitoring-grafana, port: { number: 80 } } }
          - path: /prometheus
            pathType: Prefix
            backend: { service: { name: monitoring-kube-prometheus-prometheus, port: { number: 9090 } } }
          - path: /alertmanager
            pathType: Prefix
            backend: { service: { name: monitoring-kube-prometheus-alertmanager, port: { number: 9093 } } }
