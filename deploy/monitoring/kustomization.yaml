apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podmonitors.yaml
  - rules.yaml
  - ingress.yaml
configMapGenerator:
  - name: platform-dashboard
    namespace: monitoring
    files: [dashboards/platform.json]
    options:
      disableNameSuffixHash: true
      labels: { grafana_dashboard: "1" }   # picked up by the Grafana sidecar
