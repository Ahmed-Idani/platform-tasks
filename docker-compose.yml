services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq   # RabbitMQ names its data dir after the hostname; keep it fixed so data survives container re-creation
    ports:
      - "5672:5672"    # AMQP, what the worker connects to
      - "15672:15672"  # web UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-platform.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq   # queues survive container restarts
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18
    container_name: postgres
    ports:
      - "5433:5432"    # 5432 on the host is already taken by a local Postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tasks
    volumes:
      - postgres-data:/var/lib/postgresql   # Postgres 18 images keep data under this path (not .../data)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "3900:3900"    # S3 API
      - "3903:3903"    # admin API (/health)
    environment:
      # Dev-only credentials. Access key id format: GK + 24 hex; secret: 64 hex.
      GARAGE_RPC_SECRET: "6465762d6f6e6c792d7270632d7365637265742d706c6174666f726d2d746b73"
      GARAGE_ADMIN_TOKEN: admin
      GARAGE_DEFAULT_ACCESS_KEY: GK706c6174666f726d2d746b73
      GARAGE_DEFAULT_SECRET_KEY: "6465762d6f6e6c792d73332d7365637265742d706c6174666f726d2d7461736b"
      GARAGE_DEFAULT_BUCKET: platform-tasks-dev
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      # The image is FROM scratch (no shell, no curl): ask the binary itself.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: summarizer-worker:dev
    build: ./worker
    restart: unless-stopped   # last resort if the process itself dies (OOM, bug)
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/%2F   # "rabbitmq" = the service name, not localhost
      DATABASE_URL: postgresql://admin:admin@postgres:5432/tasks   # container port, not the 5433 host mapping
      S3_ENDPOINT_URL: http://garage:3900
      S3_BUCKET: platform-tasks-dev
      AWS_REGION: garage
      AWS_ACCESS_KEY_ID: GK706c6174666f726d2d746b73
      AWS_SECRET_ACCESS_KEY: "6465762d6f6e6c792d73332d7365637265742d706c6174666f726d2d7461736b"
      N_THREADS: "1"
      TASK_TIMEOUT_S: ${TASK_TIMEOUT_S:-540}   # per-task wall clock; < stop_grace_period
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets callback_url reach a server running on your machine
    stop_grace_period: 600s   # longer than the longest task, so SIGTERM can finish it
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 3g

volumes:
  rabbitmq-data:
  postgres-data:
  garage-data: