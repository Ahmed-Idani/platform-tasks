    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111'/><path d='M9 11h14M9 16h9M9 21h11' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>" />
    <script>
      // Apply the theme before first paint, so there is no light flash in dark mode.
      (function () {
        var t = "system";
        try { t = localStorage.getItem("theme") || "system"; } catch (e) {}
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
