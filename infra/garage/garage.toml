# Garage: S3-compatible object storage for local dev (AWS S3 in prod).
# Single node, no replication. The bucket and access key are created at boot from
# GARAGE_DEFAULT_* env vars (`server --single-node --default-bucket`), see docker-compose.yml.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret comes from GARAGE_RPC_SECRET

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
# admin_token comes from GARAGE_ADMIN_TOKEN
