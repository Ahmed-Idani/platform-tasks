# A delivery that isn't acked within this time gets its channel force-closed.
# Default is 30 min. Summaries can take minutes, so set it explicitly: 1 hour.
consumer_timeout = 3600000

# Topology (exchanges, queues, dead-letter wiring) and the app user, applied on every boot.
# Apps only publish and consume; they never declare. See definitions.json.
load_definitions = /etc/rabbitmq/definitions.json
